name: Windows installer
on:
  push:
    branches: [main]
    paths: ['**.py', 'assets/**', 'requirements.txt', 'requirements-build.txt', 'packaging/**', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Test automation
        run: python -m unittest discover -s tests -v
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and smoke test application
        shell: pwsh
        run: |
          try { ./packaging/build.ps1 }
          catch { Write-Output "::error::$($_.Exception.Message)"; throw }
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            *-test.json
            *-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NTE-AI-Windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NTE-AI-GUI-preview
          path: installed-test.png
          if-no-files-found: error
